name: donaciones-u4

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: donaciones_u4
      MYSQL_USER: donaciones
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [red_interna]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment: &app_env
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: donaciones_u4
      DB_USER: donaciones
      DB_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD}
      TRUST_PROXY: "1"
      SHARED_SESSION_PATH: /sessions
    volumes:
      - php_sessions:/sessions
    depends_on:
      db:
        condition: service_healthy
    networks: [red_interna]

  app2:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    environment: *app_env
    volumes:
      - php_sessions:/sessions
    depends_on:
      db:
        condition: service_healthy
    networks: [red_interna]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app1, app2]
    networks: [red_interna]

volumes:
  mysql_data:
  php_sessions:

networks:
  red_interna:
    driver: bridge
